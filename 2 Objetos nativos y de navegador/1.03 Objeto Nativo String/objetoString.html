<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // INSTANCIACION O DECLARACION
        let daw = "Desarrollo de aplicaciones web"; // Con doble comilla
        let dam = 'Desarrollo de aplicaciones multiplataforma'; // comilla simple
        let asir = "Administracion de 'sistemas informaticos' en red";
        let asir1 = 'Administracion de "sistemas informaticos" en red';
        let smr = "Sistemas \"microinformaticos\" y redes";
        let ciclos = new String("");

        ciclos += "Hay 3 ciclos de Grado Superior: \n";
        ciclos += daw +", "+ dam + ", " + asir+"\n";
        ciclos += "Y un ciclo de Grado Medio: \n";
        ciclos +=  smr;
        console.log(ciclos);

        // PROPIEDADES
        // Length: devuelve la longitud de la cadena OJO cuenta tambien espacios
        console.log("Numero de letras en ciclos "+ciclos.length);

        //METODOS
        // - Busqueda
        //   CharAt(num) devuelve el caracter de una posicion
        console.log ("El caracter 16 de la cadena es: " + ciclos.charAt(16));
        //   IndexOf(caracter): te devuelve la primera posición de un caracter de una cadena
        console.log ("La posición de la letra es:  " + ciclos.indexOf("A"));
        //   LastIndexOf(caracter) te devuelve la ultima posicion de un caracter en una cadena
        console.log ("La ultima de la letra es:  " + ciclos.lastIndexOf("a"));
        //   search(cadena| expresion): busca una cadena o expresión regular dentro de otra cadena
        console.log("Search: " + ciclos.search("web"));
        //   match (expresiones regulares)



        // - Comparación
        //   localCompare(cadena): devuelve -1 (antes), 0 (igual), 1 (despues)
                console.log("¿Es daw menor que dam?" + daw.localeCompare(dam));
        // - Incluye, empieza o termina
        //   Includes(cadena): devuelve true si la cadena incluye la palabra
                console.log("¿Contiene la palabra aplicacion?" + daw.includes("aplicacion"));// tener siempre en cuenta Mayus y Minus
        //   startWich(cadena): devuelve true si la cadena empieza con el parametro
                console.log("¿Empieza con la letra?" + daw.startsWith("D"));
        //   endWich(cadena): devuelve true si la cadena termina con el parametro
                console.log("¿Termina con?" + daw.endsWith("D"));

        // - Concatenación y repetición
        //   concat(cadena): concatena a la cadena el parametro
                console.log("Concat"+daw.concat(dam));
        //   repeat(numero): repite la cadena el numero de veces que aparace como parametro
                console.log("Repeat "+ daw.repeat(3));
        // - Extracción 
        //   slice(<posicion incial>, <pos final>): devuelve la cadena compredida entre ambas posiciones. ***No incluye la posicion final***
                console.log("La cadena que hay entre el 0 y el 5 es: " + daw.slice(0,5));
        //   subtring(<posicion incial>, <pos final>): devuelce la cadena comprendida entre ambas posiciones. No incluye la posicion final.
                console.log("Substring: " + daw.substring(0,daw.length));
        //   substr(<pos inicioal>, <num caracteres>): devuelve la cadena comprendida entre la posicion inicial y el numero de caracteres. No incluye la posicion final. 
                console.log ("Substr " + daw.substr(0,10));
        //   split(<caracter, <numero de veces>): divide la cadena en un array de subcadenar, separadas por el caracter del primer parametro
                console.log("Split "+ daw.split("i",3));

        //   trim (<cadena>): extrae los caracteres de la cadena eliminando los espacios del principio y del final
                console.log("La cadena sin espacios quedaria: \n " +"             Hola, buenos dias".trim());


        // - Mayúsculas 
        //   toUpperCase(): te devulve la cadena en mayusculas
                console.log(daw.toUpperCase());
        // - Minúsculas
        //   toLowercase(): te devulve la cadena en minusculas
                console.log(daw.toLowerCase());

        // - Otros
        //   toString: devuelve el valor del objeto string
        //   valueOf: devuelve el valor primitico del objeto


        let cadena = "Hola buenos dias";

        console.log("Split "+ cadena.split(" ",3));     
        let cadenaArray = cadena.split(" ");
        console.log(cadenaArray);

        console.log("Letras "+ cadena.split(""));
        let letrasArray = cadena.split("");
        console.log(letrasArray);

        let porLetraArray = [];
        for (i=0; i < cadena.length; i++){
               porLetraArray[i] = cadena.charAt(i);

        }
        console.log(cadena.toUpperCase());


        
    </script>
</body>
</html>
