<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //DATOS PRIMITIVOS
        let cadena = "DAW2";
        let pi = 3.14;
        let bool = true;
        let nodefinido = undefined;
        let nulo = null;



        /*
        OBJETOS NATIVOS: No dependen del navegador
        - Array
        - Function
        - Number
        - String
        - Math
        - Object
        - Boolean
        - Date
        - RegExp (expresiones regulares)        
        */

        /*
        OBJETOS DE ALTO NIVEL: Si dependen del navegador
        - Document
        - Window
        - Navigator
        - Location
        - History
        - Screen       
        */

        /*
        DEFINICION DE OBJETO
        - Propiedades: atributos de un objeto. Se definen en modo nombre : valor
        - Metodos: acciones que se pueden ejecutar sobre un objeto

        */

        let programador={
            nombre: "David",
            apellido:"García",
            anio:1815
        }
    </script>
</body>
</html>
