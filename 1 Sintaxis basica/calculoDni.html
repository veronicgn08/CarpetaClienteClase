<body>
    <h1>Calculo letra dni</h1>
    <script>
        let numerosDni ;
        let arrayLetras = ["T","R","W","A","G","M","Y","F","P","D","X","B","N","J","Z","S","Q","V","H","L","C","K","E"];
        
        function calculoDni (numerosDni){
            let restoNumeros = numerosDni % 23;
            let letraDni = arrayLetras[restoNumeros];
            alert("El resto es: "+ restoNumeros);
            alert ("Tu letra sera: "+letraDni);
            alert("Tu DNI complero es:"+numerosDni+letraDni);
        }

        calculoDni(72895898);
    </script>
</body>
