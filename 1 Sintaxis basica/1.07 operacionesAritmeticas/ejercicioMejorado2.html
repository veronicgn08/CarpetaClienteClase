<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h3 id="peticion">Aqui iran los numeros dados</h3>
    <p id="numerosDados"></p>

    <script>
      // programa que valide si un numero es par o no

    function comprobarNumeros(inicio) {
        if (inicio % 2 == 0) {
          return true;
        } else {
          return false;
        }
    }

    //comprobarNumeros(7);

    // funcion que me genere  primero numeros pares

    function generarNumero(inicio, fin, tipo) {
        let numOrigen = inicio;
        
        

        //If para saber si es par
        if (tipo == "par" || tipo == "pares") {
            // si el numero dado es impar le sumamos uno para que sea par
            if (!comprobarNumeros(inicio)) {
                inicio++;
            }
        }else if (tipo == "impar" || tipo == "impares") {
                //si el numero dado es par le sumamos uno para que sea impar
                if (comprobarNumeros(inicio)) {
                    inicio++;
                }
        }
        document.getElementById("peticion").innerHTML = " El numero dado  de inicio es: " +numOrigen +", el numero de final es: " +fin +" y quiero que salgan los numeros: " +tipo +"</br>";

        muestraBucle(inicio,fin);    

    }

    //funcion para mostrar los numeros que hemos pedido con un inicio y un final.
    function muestraBucle(inicio,fin){
        
        for (i = inicio; i <= fin; i+=2) {
            
            document.getElementById("numerosDados").innerHTML += inicio +"</br>";
            inicio +=2;
        }
           
    }

    
    generarNumero(14,51,'par');

    document.getElementById("numerosDados").innerHTML += "</br>";
    muestraBucle(1,10)


    </script>
  </body>
</html>
