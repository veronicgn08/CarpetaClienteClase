        function crearlastIndexOf(elemento,posicion){
            let posicionElemento = 0;
            let tamañoArray = semana.length;

            if (posicion == 0 ){
                for (let i = tamañoArray-1; i >= 0; i--) {
                    
                    if (elemento == semana [i]){
                        posicionElemento = i;
                        break;
                    }   
                }
            }else{
                if(posicion < tamañoArray){
                    for (let i = posicion-1; i >= 0; i--) {
                        
                        if (elemento == semana [i]){
                            posicionElemento = i;
                            break;                     
                        }                        
                    }
                }else{
                    console.log("La posicion que has marcado supera el tamaño del array");
                }
                
            }
            console.log(posicionElemento);

        }
