    <script>
        //array para probar        
        let concesionario = ["Kia","Volkswagen","Maserati","Pagani","Ford"];

        function comoSplice (posicion,numBorrar,arrayInicial, nuevoCoche){
            
            let tamañoIncial = arrayInicial.length;
            let tamañoNuevos = nuevoCoche.length;

            if (posicion <0){
                console.log("La posicion es negativa. NO EXISTE");
            }else if (posicion > tamañoIncial-1){
                console.log("La posicion  es mayor que el tamaño del array");
            }else if(numBorrar <0){
                console.log("No es posible borrar un numero negativo");
            }else if (posicion+numBorrar > tamañoIncial){
                console.log("La cantidad de elementos a borrar supera el tamaño del array"); 
              }else{

                //Aqui muestro el array original que me hara de referencia para saber si va bien el resto.
                console.log("Este es mi array ORIGINAL");
                console.log(arrayInicial);
                //Convierto el numero negativo a positivo

                //Borro desde la posicion el numero de elementos que he dado con numBorrar
                
                for (let i = posicion; i < tamañoIncial-numBorrar; i++) {
                     arrayInicial[i] = arrayInicial[i+numBorrar];
                 }
                //actualizo la longitud del array
                arrayInicial.length = tamañoIncial - numBorrar;
                
                //muevo los datos el array para hacer hueco a los elemntos que voy a añadir copiandolos desde el final
                for (let i = arrayInicial.length-1; i >= posicion; i--) {
                    arrayInicial[i+tamañoNuevos] = arrayInicial[i];              
                }
                //inserto los datos a la posicion elegida
                for (let i = 0; i < tamañoNuevos; i++) {
                   arrayInicial[posicion+i]= nuevoCoche[i];                    
                }
                //Aqui muestro el array obtenido.
                console.log("Este es el array del RESULTADO");
                console.log(arrayInicial);
              }         

        }
        
        let a = 1;
        let nuevoCon = ["a","b"];
        //prueba con negativo en posicion 
        console.log("-----Numero negativo en posicion-----");
        comoSplice(-1,1,concesionario,["Ferrari"]); // => Salta error por el negativo en posicion.


        //prueba en negativo en borrar
        console.log("-----Numero negativo en numBorrar-----");
        comoSplice(1,-1,concesionario,["Ferrari"]); // => Salta error por el negativo en numBorrar.

        //prueba posicion 0
        console.log("-----Poniendo 0 en posicion y borrando 1-----");
        comoSplice(0,1,concesionario,["Ferrari"]); // => Correcto lo pone en la posicion 0 .

        //prueba numBorrar en 0
        console.log("-----Poniendo 0 en numBorrar y en posicion-----");

        //prueba fuera de rango posicion

        comoSplice(3,10,concesionario,["Ferrari"]); // => Salta error la cantidad de elementos a borrar supera el tamaño del array.
    
    </script>
