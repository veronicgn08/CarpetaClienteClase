<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function ordenarMayorAmenor(numeros) {
            let arrayNumerosOrdenadosMayor = [];
            
            while (numeros.length > 0) {     
                let maximo = Math.max(...numeros);
                arrayNumerosOrdenadosMayor.push(maximo);
                let indiceMaximo = numeros.indexOf(maximo);
                numeros.splice(indiceMaximo,1);
            }

            console.log(arrayNumerosOrdenadosMayor);
        }

        ordenarMayorAmenor([1,10,3,4,5,8]);


        function ordenarMenorAmayor(numeros){
            let arrayNumerosOrdenadosMenor = [];
            while(numeros.length > 0 ){

                let minimo = Math.min(...numeros);
                arrayNumerosOrdenadosMenor.push(minimo);
                let indiceMinimo = numeros.indexOf(minimo);
                numeros.splice(indiceMinimo,1);
            }
            console.log(arrayNumerosOrdenadosMenor);
        }

        ordenarMenorAmayor([1,10,3,4,5,8]);
    </script>
</body>
</html>
