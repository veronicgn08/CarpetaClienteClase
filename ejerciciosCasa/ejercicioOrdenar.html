        function ordenarMayoraMenor(numeros){
            if(Array.isArray(numeros)){
                let arrayOrdenadoMayor = [];
                
                let comprobacionNumero = true;
                //Se recorre el array para comprobar que todos los elementos sean numeros
                for (let i = 0; i < numeros.length; i++) {
                    if(typeof numeros[i] !=="number"){
                        //si el elemento no es un numero, se cambia el valor de la variable comprobacionNumero a false
                        comprobacionNumero = false;
                    }                   
                }
                if(comprobacionNumero){           
                    let j = 0;
                    while (numeros.length > 0){
                        //El maximo se inicializa con el primer elemento del array y luego se compara con los demas elementos del array para ir encontrando el numero maximo.
                        let maximo = numeros[0];
                        for(let i=1; i < numeros.length;i++){
                            maximo = Math.max(maximo, numeros [i]);
                        } 
                        //Para ir guardando en el array el numero maximo que se va encontrando en cada iteracion
                        //equivalente a arrayOrdenadoMayor.push(maximo);
                        arrayOrdenadoMayor[j]=maximo;
                        j++;
                        //Encuentra el indice del numero maximo y lo elimina del array original para que en la siguiente iteracion no se vuelva a encontrar
                        let indiceMaximo = numeros.indexOf(maximo);
                        numeros.splice(indiceMaximo,1);
                    }
                    console.log("Este seria el array ordenado de mayor a menor: " +arrayOrdenadoMayor);//mensaje que visualiza el array ordenado.
                }else{
                    console.log("Deben de ser NUMEROS");
                }
            }else{
                console.log("¡Parametros incorrectos! Deben de ser numeros en un array.");//muestra el error al no introducir un array.
            }
        }        
        ordenarMayoraMenor([1,"a",7,5,2,8,6]);


        function ordenarMenorAmayor(numeros){
            if(Array.isArray(numeros)){
                let arrayOrdenadoMenorAmayor = [];
                let comprobacionNumero = true;
                //Se recorre el array para comprobar que todos los elementos sean numeros
                for (let i = 0; i < numeros.length; i++) {
                    if(typeof numeros[i] !=="number"){
                        //si el elemento no es un numero, se cambia el valor de la variable comprobacionNumero a false
                        comprobacionNumero = false;
                    }                   
                }
                if(comprobacionNumero){
                    let j = 0;
                    while (numeros.length > 0){
                        //El minimo se inicializa con el primer elemento del array y luego se compara con los demas elementos del array para ir encontrando el numero minimo.
                        let minimo = numeros[0];
                        for(let i=1; i < numeros.length;i++){
                            //se obtiene el numero minimo comparando el minimo con el numero que hay dentro del array
                            minimo = Math.min(minimo, numeros [i]);
                        } 
                        //Para ir guardando en el array el numero minimo que se va encontrando en cada iteracion
                        //equivalente a arrayOrdenadoMenorAmayor.push(minimo);
                        arrayOrdenadoMenorAmayor[j]=minimo;
                        j++;
                        //Encuentra el indice del numero minimo y lo elimina del array original para que en la siguiente iteracion no se vuelva a encontrar
                        let indiceMinimo = numeros.indexOf(minimo);
                        numeros.splice(indiceMinimo,1);
                    }
                    console.log("Este seria el array ordenado menor a mayor: " +arrayOrdenadoMenorAmayor);//mensaje que visualiza el array ordenado.
                }else{
                    console.log("Deben de ser NUMEROS");
                }
            }else{
                console.log("¡Parametros incorrectos! Deben de ser numeros en un array.");//muestra el error al no introducir un array.      
            }
        }        
        ordenarMenorAmayor([1,7,"a",5,2,8,6]);
