    <script>
        //Por si guardara los objetos en array
        let listaCoches = [];
        // Crear un objeto coche con propiedades y métodos
        
        function Coche (marca, modelo, anioMat){
            //estos son las propiedades DADAS
            if (typeof marca !=="string" || typeof modelo !=="string"  ||  typeof anioMat !=="number"){
                console.log("Algun dato introducido es ERRONEO");
                return;
            }
                
                this.marca = marca;
                this.modelo = modelo;
                this.anioMat = anioMat;
            //para guardar los coches en un array de listaCoches
            listaCoches.push(this);

            //propiedad para CREAR una funcion que muestre la informacion dada del coche
            this.mostrarInfo = function(){
                console.log("Es un coche de marca: "+ this.marca + " modelo: "+ this.modelo + " y se matriculo en el año: " + this.anioMat);
            } 
            
        }

            //Ahora voy crear una funcion COMPROBAR si el  coche es historico o no
            Coche.prototype.comprobarHistorico = function (){
                if(this.historico === true){
                    alert("El Coche: " + this.marca +" es historico. ¡LIBRE DE IMPUESTOS!");
                }else if (this.historico === false){
                    alert("El Coche. " + this.marca + " no es historico. ¡PAGA IMPUESTOS!");
                }else{
                    alert("El Coche: " + this.marca + " no aparece registrado ");
                }
            }
            // Ahora voy a crear una funcion que me CALCULAR la antiguedad del coche
            Coche.prototype.calcularAntiguedadCoche = function (){
                let actual = new Date();
                this.AntiguedadCoche = actual.getFullYear() - this.anioMat;
                console.log("Antiguedad del coche: " + this.AntiguedadCoche + " años");
            }

        coche1 = new Coche ("Volswagenn","Golf",2020);
        coche2 = new Coche ("Ford","Mustang",1967);
        coche2.historico = true;
        coche3 = new Coche ("Kia","Niro",2018);
        coche3.historico = false;
      
        // //vamos a mostrar los coches que hay en el array 
        console.log("Estos son los coches que se han creado.")
